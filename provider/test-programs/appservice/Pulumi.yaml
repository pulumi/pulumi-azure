name: appservice
runtime: yaml

# The resources this test used to cover (`Plan`, `AppService`, `FunctionApp`) were removed in v7.
# These are their replacements, which need no source changes between v6 and v7.
resources:

  exampleResourceGroup:
    type: azure:core:ResourceGroup
    properties:
      location: East US

  exampleAccount:
    type: azure:storage:Account
    properties:
      resourceGroupName: ${exampleResourceGroup.name}
      location: ${exampleResourceGroup.location}
      accountTier: Standard
      accountReplicationType: LRS

  linuxPlan:
    type: azure:appservice:ServicePlan
    properties:
      resourceGroupName: ${exampleResourceGroup.name}
      location: ${exampleResourceGroup.location}
      osType: Linux
      skuName: S1

  linuxWebApp:
    type: azure:appservice:LinuxWebApp
    properties:
      resourceGroupName: ${exampleResourceGroup.name}
      location: ${exampleResourceGroup.location}
      servicePlanId: ${linuxPlan.id}
      siteConfig:
        applicationStack:
          nodeVersion: 22-lts
      appSettings:
        SOME_KEY: some-value

  linuxFunctionApp:
    type: azure:appservice:LinuxFunctionApp
    properties:
      resourceGroupName: ${exampleResourceGroup.name}
      location: ${exampleResourceGroup.location}
      servicePlanId: ${linuxPlan.id}
      storageAccountName: ${exampleAccount.name}
      storageAccountAccessKey: ${exampleAccount.primaryAccessKey}
      siteConfig:
        applicationStack:
          nodeVersion: "22"

  windowsPlan:
    type: azure:appservice:ServicePlan
    properties:
      resourceGroupName: ${exampleResourceGroup.name}
      location: ${exampleResourceGroup.location}
      osType: Windows
      skuName: S1

  # `virtualNetworkImagePullEnabled` is no longer computed in v7.
  windowsWebApp:
    type: azure:appservice:WindowsWebApp
    properties:
      resourceGroupName: ${exampleResourceGroup.name}
      location: ${exampleResourceGroup.location}
      servicePlanId: ${windowsPlan.id}
      siteConfig: {}
      connectionStrings:
        - name: Database
          type: SQLServer
          value: Server=some-server.mydomain.com;Integrated Security=SSPI
