name: keyvault
runtime: yaml

resources:

  exampleResourceGroup:
    type: azure:core:ResourceGroup
    properties:
      location: East US

  exampleKeyVault:
    type: azure:keyvault:KeyVault
    properties:
      location: ${exampleResourceGroup.location}
      resourceGroupName: ${exampleResourceGroup.name}
      tenantId: ${current.tenantId}
      skuName: premium
      # Now required. The v6 program never set it, so the vault uses access policies.
      rbacAuthorizationEnabled: false

  exampleAccessPolicy:
    type: azure:keyvault:AccessPolicy
    properties:
      keyVaultId: ${exampleKeyVault.id}
      tenantId: ${current.tenantId}
      objectId: ${current.objectId}
      keyPermissions:
        - Get
        - Create
        - Delete
      secretPermissions:
        - Get
        - Set
        - Delete
        - Purge
        - Recover

  exampleSecret:
    type: azure:keyvault:Secret
    properties:
      value: szechuan
      keyVaultId: ${exampleKeyVault.id}
    options:
      dependsOn:
        - ${exampleAccessPolicy}

variables:
  current:
    fn::invoke:
      function: azure:core:getClientConfig
      arguments: {}
