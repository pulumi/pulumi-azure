name: streamanalytics
runtime: yaml

resources:

  exampleResourceGroup:
    type: azure:core:ResourceGroup
    properties:
      location: West Europe

  jobStorage:
    type: azure:storage:Account
    properties:
      resourceGroupName: ${exampleResourceGroup.name}
      location: ${exampleResourceGroup.location}
      accountTier: Standard
      accountReplicationType: LRS

  # v7 turns the one-element `jobStorageAccounts` list into a single `jobStorageAccount`.
  # The job is never started, so it costs nothing.
  exampleJob:
    type: azure:streamanalytics:Job
    properties:
      resourceGroupName: ${exampleResourceGroup.name}
      location: ${exampleResourceGroup.location}
      streamingUnits: 3
      transformationQuery: SELECT * INTO [out] FROM [in]
      contentStoragePolicy: JobStorageAccount
      jobStorageAccounts:
        - accountName: ${jobStorage.name}
          accountKey: ${jobStorage.primaryAccessKey}
          authenticationMode: ConnectionString
