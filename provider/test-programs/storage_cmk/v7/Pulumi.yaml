name: storage_cmk
runtime: yaml

resources:

  exampleResourceGroup:
    type: azure:core:ResourceGroup
    properties:
      location: West US 2

  vault:
    type: azure:keyvault:KeyVault
    properties:
      resourceGroupName: ${exampleResourceGroup.name}
      location: ${exampleResourceGroup.location}
      tenantId: ${current.tenantId}
      skuName: standard
      purgeProtectionEnabled: true
      softDeleteRetentionDays: 7
      rbacAuthorizationEnabled: false

  clientPolicy:
    type: azure:keyvault:AccessPolicy
    properties:
      keyVaultId: ${vault.id}
      tenantId: ${current.tenantId}
      objectId: ${current.objectId}
      keyPermissions:
        - Get
        - Create
        - Delete
        - List
        - Restore
        - Recover
        - UnwrapKey
        - WrapKey
        - Purge
        - Encrypt
        - Decrypt
        - Sign
        - Verify
        - GetRotationPolicy
        - SetRotationPolicy

  storageKey:
    type: azure:keyvault:Key
    properties:
      keyVaultId: ${vault.id}
      keyType: RSA
      keySize: 2048
      keyOpts:
        - decrypt
        - encrypt
        - sign
        - unwrapKey
        - verify
        - wrapKey
    options:
      dependsOn:
        - ${clientPolicy}

  account:
    type: azure:storage:Account
    properties:
      resourceGroupName: ${exampleResourceGroup.name}
      location: ${exampleResourceGroup.location}
      accountTier: Standard
      accountReplicationType: LRS
      identity:
        type: SystemAssigned

  storagePolicy:
    type: azure:keyvault:AccessPolicy
    properties:
      keyVaultId: ${vault.id}
      tenantId: ${current.tenantId}
      objectId: ${account.identity.principalId}
      keyPermissions:
        - Get
        - UnwrapKey
        - WrapKey

  customerManagedKey:
    type: azure:storage:CustomerManagedKey
    properties:
      storageAccountId: ${account.id}
      # Versionless, like omitting `keyVersion` in v6.
      keyVaultKeyId: ${storageKey.versionlessId}
    options:
      dependsOn:
        - ${storagePolicy}

variables:
  current:
    fn::invoke:
      function: azure:core:getClientConfig
      arguments: {}
