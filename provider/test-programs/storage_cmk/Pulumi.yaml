name: storage_cmk
runtime: yaml

resources:

  exampleResourceGroup:
    type: azure:core:ResourceGroup
    properties:
      location: West US 2

  vault:
    type: azure:keyvault:KeyVault
    properties:
      resourceGroupName: ${exampleResourceGroup.name}
      location: ${exampleResourceGroup.location}
      tenantId: ${current.tenantId}
      skuName: standard
      # Required for storage customer-managed keys.
      purgeProtectionEnabled: true
      softDeleteRetentionDays: 7

  clientPolicy:
    type: azure:keyvault:AccessPolicy
    properties:
      keyVaultId: ${vault.id}
      tenantId: ${current.tenantId}
      objectId: ${current.objectId}
      keyPermissions:
        - Get
        - Create
        - Delete
        - List
        - Restore
        - Recover
        - UnwrapKey
        - WrapKey
        - Purge
        - Encrypt
        - Decrypt
        - Sign
        - Verify
        - GetRotationPolicy
        - SetRotationPolicy

  storageKey:
    type: azure:keyvault:Key
    properties:
      keyVaultId: ${vault.id}
      keyType: RSA
      keySize: 2048
      keyOpts:
        - decrypt
        - encrypt
        - sign
        - unwrapKey
        - verify
        - wrapKey
    options:
      dependsOn:
        - ${clientPolicy}

  account:
    type: azure:storage:Account
    properties:
      resourceGroupName: ${exampleResourceGroup.name}
      location: ${exampleResourceGroup.location}
      accountTier: Standard
      accountReplicationType: LRS
      identity:
        type: SystemAssigned

  storagePolicy:
    type: azure:keyvault:AccessPolicy
    properties:
      keyVaultId: ${vault.id}
      tenantId: ${current.tenantId}
      objectId: ${account.identity.principalId}
      keyPermissions:
        - Get
        - UnwrapKey
        - WrapKey

  # v7 replaces `keyVaultId` and `keyName` with a single `keyVaultKeyId`. With no `keyVersion`,
  # the account always uses the latest version of the key.
  customerManagedKey:
    type: azure:storage:CustomerManagedKey
    properties:
      storageAccountId: ${account.id}
      keyVaultId: ${vault.id}
      keyName: ${storageKey.name}
    options:
      dependsOn:
        - ${storagePolicy}

variables:
  current:
    fn::invoke:
      function: azure:core:getClientConfig
      arguments: {}
