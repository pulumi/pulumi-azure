name: loganalytics
runtime: yaml

resources:

  exampleResourceGroup:
    type: azure:core:ResourceGroup
    properties:
      location: East US 2

  exampleIdentity:
    type: azure:authorization:UserAssignedIdentity
    properties:
      resourceGroupName: ${exampleResourceGroup.name}
      location: ${exampleResourceGroup.location}

  federatedCred:
    type: azure:armmsi:FederatedIdentityCredential
    properties:
      userAssignedIdentityId: ${exampleIdentity.id}
      audience: api://AzureADTokenExchange
      issuer: https://token.actions.githubusercontent.com
      subject: repo:pulumi/pulumi-azure:ref:refs/heads/master

  exampleWorkspace:
    type: azure:operationalinsights:AnalyticsWorkspace
    properties:
      resourceGroupName: ${exampleResourceGroup.name}
      location: ${exampleResourceGroup.location}
      sku: PerGB2018
      retentionInDays: 30
      internetIngestionAccessType: Enabled
      internetQueryAccessType: Disabled
      localAuthenticationEnabled: true

  exampleAccount:
    type: azure:storage:Account
    properties:
      resourceGroupName: ${exampleResourceGroup.name}
      location: ${exampleResourceGroup.location}
      accountTier: Standard
      accountReplicationType: LRS

  linkedStorage:
    type: azure:loganalytics:LinkedStorageAccount
    properties:
      dataSourceType: CustomLogs
      resourceGroupName: ${exampleResourceGroup.name}
      workspaceId: ${exampleWorkspace.id}
      storageAccountIds:
        - ${exampleAccount.id}
