name: containerservice_k8scluster
runtime: yaml

resources:

  rg:
    type: azure:core:ResourceGroup
    properties:
      location: West US 2

  exampleKubernetesCluster:
    type: azure:containerservice:KubernetesCluster
    properties:
      location: ${rg.location}
      resourceGroupName: ${rg.name}
      dnsPrefix: exampleakstest
      defaultNodePool:
        name: default
        nodeCount: 1
        vmSize: Standard_D2s_v3
      identity:
        type: SystemAssigned
      tags:
        Environment: Production
      networkProfile:
        networkPlugin: azure
        loadBalancerSku: standard
      # Now required. `Manual` is the v6 behaviour.
      nodeProvisioningProfile:
        mode: Manual
      # Pinned to the cluster's current value. Azure enables the OIDC issuer by default from
      # Kubernetes 1.34, so it's on here even though the v6 program never set it. It can't be
      # turned off again, so pinning `false` would replace the cluster.
      oidcIssuerEnabled: true
