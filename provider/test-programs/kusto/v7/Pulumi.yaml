name: kusto
runtime: yaml

resources:

  exampleResourceGroup:
    type: azure:core:ResourceGroup
    properties:
      location: North Europe

  kusto:
    type: azure:kusto:Cluster
    properties:
      resourceGroupName: ${exampleResourceGroup.name}
      location: ${exampleResourceGroup.location}
      # Language extensions need a SKU that supports nested virtualization, which rules out the
      # Dev SKUs.
      sku:
        name: Standard_E2ads_v5
        capacity: 2
      languageExtensions:
        - name: PYTHON
          image: Python3_11_7
