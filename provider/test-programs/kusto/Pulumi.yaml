name: kusto
runtime: yaml

resources:

  exampleResourceGroup:
    type: azure:core:ResourceGroup
    properties:
      location: North Europe

  # v6 deprecated `languageExtensions` in favour of `languageExtension`. v7 removes the latter,
  # and the surviving property keeps the plural name.
  # Cluster names must be lower case, and they aren't lower-cased when auto-named.
  kusto:
    type: azure:kusto:Cluster
    properties:
      resourceGroupName: ${exampleResourceGroup.name}
      location: ${exampleResourceGroup.location}
      # Language extensions need a SKU that supports nested virtualization, which rules out the
      # Dev SKUs.
      sku:
        name: Standard_E2ads_v5
        capacity: 2
      languageExtension:
        - name: PYTHON
          image: Python3_11_7
