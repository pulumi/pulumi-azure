name: network
runtime: yaml

resources:

  exampleResourceGroup:
    type: azure:core:ResourceGroup
    properties:
      location: East US

  exampleVirtualNetwork:
    type: azure:network:VirtualNetwork
    properties:
      addressSpaces:
        - 10.0.0.0/16
      location: ${exampleResourceGroup.location}
      resourceGroupName: ${exampleResourceGroup.name}

  # `serviceEndpoints` changes from a list of strings to a list of objects in v7.
  exampleSubnet:
    type: azure:network:Subnet
    properties:
      resourceGroupName: ${exampleResourceGroup.name}
      virtualNetworkName: ${exampleVirtualNetwork.name}
      addressPrefixes:
        - 10.0.2.0/24
      serviceEndpoints:
        - Microsoft.Storage
        - Microsoft.KeyVault

  # The same change, on a subnet declared inline.
  inlineVirtualNetwork:
    type: azure:network:VirtualNetwork
    properties:
      addressSpaces:
        - 10.1.0.0/16
      location: ${exampleResourceGroup.location}
      resourceGroupName: ${exampleResourceGroup.name}
      subnets:
        - name: inline
          addressPrefixes:
            - 10.1.1.0/24
          serviceEndpoints:
            - Microsoft.Storage

  exampleNetworkInterface:
    type: azure:network:NetworkInterface
    properties:
      location: ${exampleResourceGroup.location}
      resourceGroupName: ${exampleResourceGroup.name}
      ipConfigurations:
        - name: internal
          subnetId: ${exampleSubnet.id}
          privateIpAddressAllocation: Dynamic

  examplePublicIp:
    type: azure:network:PublicIp
    properties:
      resourceGroupName: ${exampleResourceGroup.name}
      location: ${exampleResourceGroup.location}
      allocationMethod: Static
      sku: Standard
      ipVersion: IPv4
      tags:
        environment: Production

  exampleRouteTable:
    type: azure:network:RouteTable
    properties:
      location: ${exampleResourceGroup.location}
      resourceGroupName: ${exampleResourceGroup.name}

  exampleRoute:
    type: azure:network:Route
    properties:
      resourceGroupName: ${exampleResourceGroup.name}
      routeTableName: ${exampleRouteTable.name}
      addressPrefix: 10.1.0.0/16
      nextHopType: VnetLocal

  exampleNetworkSecurityGroup:
    type: azure:network:NetworkSecurityGroup
    properties:
      location: ${exampleResourceGroup.location}
      resourceGroupName: ${exampleResourceGroup.name}

  exampleNetworkSecurityRule:
    type: azure:network:NetworkSecurityRule
    properties:
      priority: 100
      direction: Outbound
      access: Allow
      protocol: Tcp
      sourcePortRange: '*'
      destinationPortRange: '*'
      sourceAddressPrefix: '*'
      destinationAddressPrefix: '*'
      resourceGroupName: ${exampleResourceGroup.name}
      networkSecurityGroupName: ${exampleNetworkSecurityGroup.name}
