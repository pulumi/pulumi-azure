name: storage
runtime: yaml

resources:

  exampleResourceGroup:
    type: azure:core:ResourceGroup
    properties:
      location: East US

  exampleAccount:
    type: azure:storage:Account
    properties:
      resourceGroupName: ${exampleResourceGroup.name}
      location: ${exampleResourceGroup.location}
      accountTier: Standard
      accountReplicationType: LRS
      accountKind: StorageV2
      tags:
        environment: staging
      # Both blocks move to resources of their own in v7. `hourMetrics` and `minuteMetrics` can't be
      # set here in v6: the schema omits `enabled`, which the provider requires.
      staticWebsite:
        indexDocument: index.html
        error404Document: 404.html
      queueProperties:
        logging:
          delete: true
          read: true
          write: true
          version: "1.0"
          retentionPolicyDays: 7

  # Each of these references its parent by name here, and by ID or URL in v7.
  exampleContainer:
    type: azure:storage:Container
    properties:
      storageAccountName: ${exampleAccount.name}
      containerAccessType: private

  exampleBlob:
    type: azure:storage:Blob
    properties:
      storageAccountName: ${exampleAccount.name}
      storageContainerName: ${exampleContainer.name}
      type: Block
      source:
        fn::stringAsset: foo

  exampleQueue:
    type: azure:storage:Queue
    properties:
      storageAccountName: ${exampleAccount.name}

  exampleTable:
    type: azure:storage:Table
    properties:
      storageAccountName: ${exampleAccount.name}

  # Share names must be lower case, and shares aren't lower-cased when auto-named.
  exampleshare:
    type: azure:storage:Share
    properties:
      storageAccountName: ${exampleAccount.name}
      quota: 50

  exampleShareDirectory:
    type: azure:storage:ShareDirectory
    properties:
      name: logs
      storageShareId: ${exampleshare.id}

  exampleShareFile:
    type: azure:storage:ShareFile
    properties:
      name: readme.txt
      storageShareId: ${exampleshare.id}
