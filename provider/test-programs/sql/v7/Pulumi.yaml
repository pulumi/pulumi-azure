name: sql
runtime: yaml

resources:

  exampleResourceGroup:
    type: azure:core:ResourceGroup
    properties:
      location: West US

  examplesql:
    type: azure:mssql:Server
    properties:
      resourceGroupName: ${exampleResourceGroup.name}
      location: ${exampleResourceGroup.location}
      version: '12.0'
      administratorLogin: 4dm1n157r470r
      administratorLoginPassword: 4-v3ry-53cr37-p455w0rd
      tags:
        environment: production

  exampleAccount:
    type: azure:storage:Account
    properties:
      resourceGroupName: ${exampleResourceGroup.name}
      location: ${exampleResourceGroup.location}
      accountTier: Standard
      accountReplicationType: LRS

  exampleDatabase:
    type: azure:mssql:Database
    properties:
      serverId: ${examplesql.id}
      skuName: S0
      threatDetectionPolicy:
        state: Enabled
        emailAccountAdminsEnabled: true
      longTermRetentionPolicy:
        weeklyRetention: P4W
      tags:
        environment: production

  exampleFwRule:
    type: azure:mssql:FirewallRule
    properties:
      serverId: ${examplesql.id}
      startIpAddress: 10.0.17.62
      endIpAddress: 10.0.17.62

  exampleAlertPolicy:
    type: azure:mssql:ServerSecurityAlertPolicy
    properties:
      resourceGroupName: ${exampleResourceGroup.name}
      serverName: ${examplesql.name}
      state: Enabled
      emailAccountAdminsEnabled: true

  exampleAuditingPolicy:
    type: azure:mssql:ServerExtendedAuditingPolicy
    properties:
      serverId: ${examplesql.id}
      blobStorageEndpoint: ${exampleAccount.primaryBlobEndpoint}
      storageAccountAccessKey: ${exampleAccount.primaryAccessKey}
      retentionInDays: 30
